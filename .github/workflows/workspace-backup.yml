name: Backup tools synthetic verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/*backup*'
      - 'scripts/backup-di.mjs'
      - 'scripts/verify-di-postgres.mjs'
      - 'tests/fixtures/di-backup-postgres.sql'
      - 'tests/backup-restore.test.ts'
      - 'tests/backup-di.test.ts'
      - '.github/workflows/workspace-backup.yml'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      # No production secrets, hosted DB calls or artifact uploads.
      - run: npx vitest run tests/backup-di.test.ts
      - if: runner.os == 'Linux'
        run: npx vitest run tests/backup-restore.test.ts
      - if: runner.os == 'Linux'
        run: node scripts/verify-di-postgres.mjs
